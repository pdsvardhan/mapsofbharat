name: ci
on:
  push:
    branches: ['**']
  pull_request:

# Two jobs, deliberately split by what they NEED rather than by what they do.
#
# `quality` needs only the repo, so it is fast and runs anywhere. `e2e` needs the
# canonical atlas DB and the raw source tree, BOTH of which are gitignored (12MB
# and 825MB) — which is why the end-to-end suite had never actually run in CI and
# sat behind a `vars.RUN_TESTS` flag that was never turned on. The runner is
# self-hosted on the box where that data lives, so the job mounts it READ-ONLY
# (see container.volumes below, permitted via act_runner valid_volumes).
#
# The build happens once, in `e2e`, because it is the slow step and `quality`
# does not need an artefact — only type and lint correctness.
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-adr-refs.sh
      # ONE NODE VERSION, NAMED IN FIVE PLACES, AND IT IS LOAD-BEARING (#610, #659).
      #
      # .nvmrc says 20.20.2 and is the AUTHORITY — not the only place that says so.
      # The five, added up rather than asserted: .nvmrc (1) + the Dockerfile's FROMs
      # (3, all node:20.20.2-slim) + package.json `engines` (1). Two checks hold them
      # together. scripts/check-node-version.mjs compares the RUNNING Node to .nvmrc —
      # from playwright.config.ts, from scripts/test-isolated.sh and from `npm run
      # check:node`. scripts/check-node-pins.mjs, the step below, compares the other
      # four declarations to it. With both, moving Node is a one-line change to .nvmrc
      # plus a failure naming every copy you have not carried it through to.
      #
      # THE ADDITION IS WRITTEN OUT BECAUSE THIS PARAGRAPH HAS BEEN WRONG ABOUT ITS OWN
      # COUNTS TWICE, and both times the count was wrong and the list beside it was
      # right. It said FOUR places above a list of five, and THREE declarations above a
      # comparison of four. Neither number is worth trusting from here — both are
      # printed by something that measured them:
      #
      #   $ git grep -n "20\.20\.2" -- .nvmrc Dockerfile package.json .gitea \
      #       | grep -vE ':[0-9]+:[[:space:]]*#'
      #   → 5 lines, and they are the five places
      #
      #   $ node scripts/check-node-pins.mjs
      #   → the OK line names everything it compared; move .nvmrc alone and it prints
      #     `4 of 4 declaration(s) disagree`, which is where the four comes from
      #
      # THE SECOND CHECK EXISTS BECAUSE THIS PARAGRAPH USED TO BE WRONG IN A WAY THAT
      # COST SOMETHING (iter-46 item 1084). It said .nvmrc was "the only place that
      # says so" — contradicted two lines later by its own list — and that moving Node
      # was ALREADY a one-line change. A verifier changed .nvmrc to 20.19.2 and nothing
      # noticed: the Dockerfile still built 20.20.2 three times, `engines` still said
      # 20.20.2, check-node-version passed, and all six other check scripts in this job
      # exited 0. The duplication was real and unguarded, and the comment was the
      # reason nobody would go looking for the comparison — it said the comparison
      # already existed. That is the same defect as item 1074: a comment that stops the
      # next reader writing the check they believe is already there.
      #
      # THIS USED TO READ `node-version: 20`, AND THE WORD "20" WAS THE BUG. It floated,
      # as did the Dockerfile's `node:20-slim`. The two agreed the day they were written
      # and drifted apart afterwards, which is how the gap opened without anyone
      # deciding to open it.
      #
      # TWO CORRECTIONS ARE KEPT HERE BECAUSE BOTH WERE CONFIDENT AND BOTH WERE WRONG.
      # iter-43: the pin was 22, so CI was the only place this project ever ran on 22 —
      # testing a runtime that never ships. iter-45: this comment then blamed Node 22
      # for the "ReferenceError: exports is not defined in ES module scope" that killed
      # the e2e job, and said the same specs "pass on 20". Both halves were wrong, and
      # correcting the pin to 20 did not turn the job green — it stayed red for three
      # more weeks.
      #
      # The real boundary is a Node PATCH release. Everything else held constant (this
      # repo, Playwright 1.60.0): node:20.19.4-slim LISTS the tests and node:20.19.5-slim
      # THROWS, because from 20.19.5 Node routes a .mjs through the ESM loader regardless
      # of the CommonJS Playwright compiled it into. "Passes on 20 locally" was true only
      # because the VAULT7A host ran 20.19.2, one side of that boundary, while this
      # container and production both run 20.20.2 on the other. No major-version pin can
      # express that difference — which is why the pin is a full version now.
      #
      # The pin is still not the fix. The fix is that no spec imports a .mjs any more
      # (the check-spec-imports step below), which holds on every Node. The pin, and the
      # two checks that enforce it, are what stop the next patch-level divergence from
      # being invisible for weeks.
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }

      # The four declarations named above must agree with each other. Runs here, right
      # after the step that consumes .nvmrc, and before `npm ci`: it needs nothing but
      # the repo and any Node at all. It also fails when it MEASURED nothing — no node
      # FROM in the Dockerfile, no `engines`, no setup-node in any workflow — because a
      # cross-check with nothing to cross-check would otherwise print the same OK as a
      # repo that agrees with itself.
      #
      # And since iter-46, it fails when it measured LESS than it should have. A
      # digest-pinned `FROM node@sha256:…` used to parse as the image `node@sha256`,
      # match nothing, and be skipped in silence: two of three FROMs stopped being
      # compared while the OK line still said "and so does everywhere else". The
      # Dockerfile's node FROMs are counted twice now, by the parser and by a cruder
      # test, and the two disagreeing is itself a failure.
      - run: node scripts/check-node-pins.mjs

      # Survey-of-India boundary gate (#405): checksum + geometry + property
      # fingerprint (vs scripts/boundary-fingerprint.json) + always-on extent
      # asserts. Blocks any commit that silently changes the boundary geojson or
      # crops claimed territory (J&K / Ladakh / Aksai Chin / Arunachal), and the
      # extent asserts run even under --write so a regenerated golden cannot
      # launder a crop. Mutation-proven 7/7 on 2026-08-20.
      # Intentional edits: `node scripts/check-boundaries.mjs --write` (reviewed).
      - run: node scripts/check-boundaries.mjs

      - run: npm ci
      - run: npx tsc --noEmit

      # The cascade guard (#524) — an unlayered bare selector in globals.css
      # outranks every Tailwind utility, app-wide and silently.
      - run: node scripts/check-globals-layers.mjs

      # No spec may import a .mjs (#610, iter-45). Playwright compiles what a spec
      # imports to CommonJS; from Node 20.19.5 Node loads a .mjs through the ESM
      # loader anyway, so the run dies with "exports is not defined in ES module
      # scope" before any test executes. That is what made `e2e` red on main for
      # weeks while the same specs passed on the box — the host is 20.19.2 and this
      # container is 20.20.2, so the box sat on the other side of the boundary.
      # Measured: node:20.19.4-slim lists the tests, node:20.19.5-slim throws.
      #
      # It lives HERE and not in prebuild deliberately: the guard fails when it
      # scans no spec files, which is right for a repo checkout and wrong for a
      # build context that may not carry tests/.
      - run: node scripts/check-spec-imports.mjs

      # `cmd | grep -q` under pipefail fails when grep matches EARLY: grep exits,
      # the writer takes SIGPIPE, and pipefail reports the writer's 141. So the
      # pipeline's answer inverts under load. It bit restore-drill.sh, was fixed
      # locally, and came back in setup-backup-remote.sh — hence a rule rather
      # than a memory (#609).
      - run: node scripts/check-pipefail-grep.mjs

      # Lint as a RATCHET, not a wish. This step used to be
      # `npm run lint || echo "lint warnings (non-blocking)"`, which let a commit
      # add any number of new problems while CI stayed green — a check that could
      # not fail. The backlog (mostly `any` in the MapLibre glue and vendored
      # matplotlib JS) does not block work, but it can only shrink.
      - run: node scripts/check-lint-baseline.mjs

  e2e:
    runs-on: ubuntu-latest

    # SERIALISED BEHIND `quality`, and it is not about ordering preference (iter-45).
    #
    # The two jobs used to start in the same second, and both resolve
    # actions/setup-node@v4 into the runner's shared action cache at
    # /root/.cache/act/<hash>. When they race, one of them dies three seconds in with
    #   lstat /root/.cache/act/<hash>/.prettierrc.json: no such file or directory
    # before npm ci or any project check runs. It hit `quality` on run 832 and `e2e` on
    # run 833 — same error, different victim, which is what a race looks like. Run 831
    # happened to stagger them by a minute and was green.
    #
    # `needs` makes the stagger deterministic instead of lucky. The runner-level fix
    # (capacity 1, or a per-job cache path) would help every repo on the box and is
    # recorded as a to-do; this one is in the repo that needs it, today.
    #
    # It also stops burning six minutes of browser tests on a commit that fails tsc.
    needs: quality

    container:
      image: mcr.microsoft.com/playwright:v1.49.0-jammy
      # READ-ONLY. The job reads the real catalogue and the real source files; it
      # can never write to either. Both paths are allow-listed in the runner's
      # container.valid_volumes.
      volumes:
        - /mnt/storage/websites/mapsofbharat/data:/host-data:ro
        - /mnt/storage/websites/mapsofbharat/pipeline/raw-new:/host-raw-new:ro
        # There are TWO raw trees, not one. pipeline/raw holds the Census source
        # workbooks — a single file there serves 12 metrics — and mounting only
        # raw-new produced a build that failed the raw-assets guard with
        # "1 of 27 hosted raw files are missing". Found by running it, not by
        # reading the code.
        - /mnt/storage/websites/mapsofbharat/pipeline/raw:/host-raw:ro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }

      # test-isolated.sh resolves a free port from the kernel socket table rather
      # than guessing; the playwright image ships without iproute2.
      # iproute2: test-isolated.sh resolves a free port from the kernel socket
      # table and the playwright image ships without `ss`.
      # build-essential: better-sqlite3 is a NATIVE module and there is no
      # prebuilt binary for this image's Node, so npm ci falls back to node-gyp —
      # which died with `not found: make` because the image carries no compiler.
      # This was invisible while CI was pinned to Node 22, where a prebuilt binary
      # did exist: the pin was hiding a missing toolchain, and correcting the pin
      # to the Node that actually ships (iter-43) exposed it.
      - run: apt-get update -qq && apt-get install -y -qq iproute2 build-essential

      - run: npm ci

      # Install the browser npm actually resolved, rather than trusting the image
      # tag to match. The image pins Playwright 1.49 browsers; package.json carries
      # "^1.49.0", which resolves to 1.60 — so every one of the 178 browser tests
      # failed with "Executable doesn't exist" while 71 API-only tests passed. That
      # coupling breaks silently on any minor bump, so it is removed rather than
      # re-pinned: the image supplies the OS, npm supplies the browser, and the two
      # can no longer disagree. A no-op when they already match.
      - run: npx playwright install --with-deps chromium

      # Stage the gitignored data into the places the app expects. The DB is
      # copied (12MB) so the app's read-only handle owns its own inode; the raw
      # tree is symlinked, because copying 825MB per push to read a few files
      # would dominate the run.
      - name: Stage the canonical DB and the raw source tree
        run: |
          mkdir -p data pipeline
          cp /host-data/mapsofbharat.db data/mapsofbharat.db
          ln -sfn /host-raw-new pipeline/raw-new
          ln -sfn /host-raw pipeline/raw
          ls -la data/mapsofbharat.db
          echo "raw-new entries: $(find -L pipeline/raw-new -type f | wc -l), raw entries: $(find -L pipeline/raw -type f | wc -l)"

      # ALLOW_MISSING_RAW downgrades the new postbuild output check to a warning for
      # THIS step only, because the standalone raw trees are staged in the next step
      # and cannot exist yet. The strict run happens immediately after that staging,
      # so nothing is waived — it is sequenced. Do not copy this flag anywhere else.
      - run: ALLOW_MISSING_RAW=1 npm run build

      # Point the STANDALONE output at the mounted raw trees.
      #
      # Next traces pipeline/raw* into .next/standalone at build time. On the server
      # those are real directories and it copies them; here they are symlinks to a
      # read-only mount and the trace does not follow them, so the standalone tree
      # ends up without them. The build guard still passed - it checks the SOURCE
      # tree, which is present - and then at runtime /metric/<id>/raw fell back to a
      # 307 redirect to censusindia.gov.in with x-raw-source: fallback-official-link.
      #
      # That is #498's failure mode wearing a different hat: source-present,
      # output-missing. Recorded as its own to-do, because the guard should be
      # asserting the OUTPUT rather than the input.
      - name: Point the standalone build at the mounted raw trees
        run: |
          mkdir -p .next/standalone/pipeline
          ln -sfn /host-raw-new .next/standalone/pipeline/raw-new
          ln -sfn /host-raw .next/standalone/pipeline/raw
          find -L .next/standalone/pipeline -type f | wc -l

      # The gate that would have caught the above being missing (to-do #555). The
      # prebuild check validates the SOURCE tree, and passed happily while this
      # symlinked standalone tree had nothing in it, so /metric/<id>/raw served a 307
      # to censusindia.gov.in. This asserts the artefact the tests are about to run
      # against. Strict: no ALLOW_MISSING_RAW here, deliberately.
      - name: Assert the standalone build can actually serve its raw downloads
        run: node scripts/check-raw-assets.mjs --output

      # A running instance must survive .next going away under it (#607). A build
      # in another terminal wipes .next as its first act, and an instance serving
      # out of .next/standalone loses server.js and every chunk while keeping its
      # PID — so the suite reports twenty-second timeouts that read as map
      # regressions and are a build. Both harnesses now serve a per-run hardlink
      # copy instead. This guard carries its own control: it also stands up the
      # OLD arrangement and requires it to break, and exits ERROR if it does not,
      # because at that point the guard has stopped measuring anything.
      - name: A concurrent build must not void a running instance
        run: bash scripts/check-build-isolation.sh

      # The full suite against a scratch instance of the STANDALONE build — never
      # the production container. The harness proves the instance writes to a
      # throwaway corrections store before it hands it to the suite (#481).
      # PW_WORKERS=1 in CI, deliberately.
      #
      # Two workers cold-launch two Chromium processes at once inside the job
      # container, and that crashes: SIGSEGV during launch, with dbus absent
      # ("Failed to connect to socket /run/dbus/system_bus_socket"). It hit 2 of the
      # first 3 real runs, and on the second it took the retry down with it, so the
      # job went red on a commit that changed one markdown file.
      #
      # This is the same finding to-do 253 already recorded for this box - "VAULT7A
      # flakes under unbounded parallelism ... cap here so green means green" - and
      # playwright.config.ts already exposes the override for exactly this. It costs
      # about 90 seconds and buys a signal that means something.
      - run: PW_WORKERS=1 bash scripts/test-isolated.sh --reporter=line

      # THE LAUNCHED HALF, and it is not optional (iter-43, #580).
      #
      # Every robots signal on this site - the X-Robots-Tag header in
      # middleware.ts, robots.txt in app/robots.ts, and the <meta> the root layout
      # emits - is derived from SITE_LAUNCHED. Nothing in this repo ever set it, so
      # the launched branch of every launch-aware spec was written and never
      # executed, and a real defect shipped green: `/` was statically prerendered,
      # which froze `noindex, nofollow` into its HTML, so at launch the homepage
      # would have told crawlers to skip it with no header left to disagree. The
      # iteration's own test caught it - in a configuration nothing ran.
      #
      # Only the launch-sensitive specs run here; the rest are state-independent
      # and re-running them buys nothing but minutes.
      - run: PW_WORKERS=1 bash scripts/test-isolated.sh --launched --reporter=line
          tests/iter43-hardening.spec.ts tests/seo-metadata.spec.ts
          tests/noindex.spec.ts tests/seo.spec.ts tests/embed-noindex.spec.ts
