name: ci
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  quality:                      # always hard — fast gates (standard CI template, todo 4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-adr-refs.sh
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # Survey-of-India boundary gate (#405): checksum + geometry fingerprint (vs
      # scripts/boundary-fingerprint.json) + always-on extent asserts. Blocks any commit that
      # silently changes the boundary geojson or crops claimed territory (J&K/Ladakh/Aksai
      # Chin/Arunachal). Intentional edits: `node scripts/check-boundaries.mjs --write` (reviewed).
      - run: node scripts/check-boundaries.mjs
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint --if-present || echo "lint warnings (non-blocking)"
      - run: npm run build
  # Full Playwright e2e needs a SERVED app + the canonical DB (gitignored, ~12MB), which CI
  # doesn't have — so it stays gated behind the RUN_TESTS repo variable. The full flow_test
  # matrix runs nightly on the server (03:30 cron, per the feature-verifier design) where the
  # DB lives. To run e2e in CI you'd seed a fixture DB + serve the standalone build first.
  tests:
    if: ${{ vars.RUN_TESTS == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.49.0-jammy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test --if-present
      - run: npx playwright test --if-present
