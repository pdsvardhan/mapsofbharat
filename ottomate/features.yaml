features:
  - id: feat-geo-backbone
    title: Geography backbone and region crosswalk
    short_description: "The hard part: a crosswalk reconciling Census-2011 districts
      with today's boundaries, so old data renders correctly on the current,
      Survey-of-India-compliant map."
    type: backend
    status: done
    priority: P0
    size: L
    test_status: partial
    notes: "Current-day crosswalk implemented + validated 2026-06-09 (see ADR
      adr-010-subdistrict-crosswalk). Sub-district reaggregation: SHRUG pc11
      sub-district polygons (WGS84) -> representative_point -> point-in-polygon
      within current districts -> sum raw PCA counts -> recompute rates. Keyed
      by unique rid = st_code_dtcode everywhere (geojson property, DB
      region_code, MapLibre promoteId); this fixed 36 duplicate dt_code
      collisions between re-cut Andhra Pradesh and Maharashtra (e.g. code 519 =
      Srikakulam + Mumbai). Validation vs official 2011 district PCA: median
      diff 0.00 pct, 489/594 within 2 pct. Wrote 8760 values across 730
      districts; total pop 1.19B (1.6 pct under census). Pipeline:
      pipeline/add_rid.py + pipeline/reaggregate.py."
    acceptance_criteria:
      - content: A Census-2011 sub-district to current-district crosswalk (rid-keyed)
          reaggregates 2011 data onto current boundaries, validated against
          official PCA (median diff < 2%)
        test_status: passing
        linked_test: pipeline/test_pipeline.py
      - content: "Geometry is served pre-compressed with encoding negotiation: a client
          offering brotli gets the .br variant, one offering only gzip gets the
          .gz (never the raw file), and one offering neither gets the original
          intact. A stated qvalue preference is honoured and q=0 is treated as a
          refusal. The atlas payload drops 104,519 bytes against the recorded
          TEC-20 baseline, geometry 286.6 -> 184.5 KB (adr-038)."
        test_status: passing
        linked_test: tests/geodata-encoding.spec.ts
      - content: Every state and district polygon resolves to one canonical region_id
        test_status: passing
        linked_test: pipeline/test_pipeline.py
      - content: Boundary set passes a Survey-of-India compliance check (J&K, Ladakh,
          Arunachal, Aksai Chin)
        test_status: passing
        linked_test: scripts/check-boundaries.mjs
    dependencies: []
  - id: feat-canonical-store
    title: Canonical metric store and schema
    short_description: All data lives in one canonical store — region × metric ×
      year × value — with full metadata on every metric.
    type: backend
    status: done
    priority: P0
    size: M
    test_status: passing
    acceptance_criteria:
      - content: Schema region x metric x year x value plus metric metadata is migrated
        test_status: not-tested
        linked_test: null
      - content: Saitual (Mizoram, created 2019) intentionally has no region_keys row
          and renders no polygon. districts.geojson and region_keys stay
          one-for-one at 735, and no in-repo official source can produce its
          boundary, so none is invented (adr-031). Sources printing a Saitual
          row are dropped at district level; NCRB and JJM record a skip_reason,
          while ISFR folds it into Aizawl by an explicit documented alias. A
          keyless region_keys row is never inserted to make a count read 11.
        test_status: not-tested
        linked_test: null
      - content: A metric can be loaded and queried by region and year
        test_status: not-tested
        linked_test: null
    dependencies: []
