  - id: feat-metric-families
    title: Metric families as small multiples
    short_description: A set of related official indicators drawn as one grid of
      district choropleths, so a whole subject reads at a glance. Nine families
      declared in lib/metric-families.ts, each with an explicit shared or free
      axis, and a part-to-whole caption only where the members were measured to
      decompose.
    type: ui
    status: done
    priority: P2
    size: M
    test_status: partial
    notes: "Roadmap #547 phase B. Plan in
      planning/547-small-multiples-and-transitions.md; adr-d3geo governs how
      geometry reaches the page. Built in Ottomate iteration 40 (items 968-975)
      and iteration 41 (item 976). Phase C (metric-to-metric transition) is NOT
      built. THREE FURTHER ACCEPTANCE CRITERIA did not fit the 5-AC cap and are
      recorded here rather than dropped: (6) geometry is defined once per page
      in a defs sprite and referenced per panel, and nothing at runtime imports
      d3-geo; (7) an unknown family id returns 404, an absent store or
      unreadable geometry artefact states what is missing instead of rendering
      an empty grid, and a declared member absent from the store is named on the
      page; (8) each family is reachable from every member metric page and from
      a /family index, and the index plus every family appears in sitemap.xml.
      All three are asserted by tests/family-grid.spec.ts."
    acceptance_criteria:
      - content: A family page renders one panel per resolved member; every panel draws
          every district in the artefact, with districts outside the family's
          shared set present in the no-data tone rather than omitted.
        test_status: not-tested
        linked_test: null
      - content: "The axis in force is the one the family declares: a shared axis
          classifies over one pooled domain and renders exactly one legend; a
          free axis classifies each member on its own values and renders no
          legend, stating each panel's range in its caption instead."
        test_status: not-tested
        linked_test: null
      - content: Panels classify through lib/breaks.ts with the same stats membership
          the atlas uses (countsInStats, adr-022), so a panel classes a metric
          the way the main map does.
        test_status: not-tested
        linked_test: null
      - content: A part-to-whole caption appears only for families measured to
          decompose, and prints the measured figure and district count rather
          than a rounded one; every other family carries the opposite statement.
        test_status: not-tested
        linked_test: null
      - content: Every panel is a figure with a figcaption, and its accessible name
          carries both the value range and whether the scale is shared or not
          comparable across panels.
        test_status: not-tested
        linked_test: null
    dependencies: []
  - id: feat-metric-shift
    title: Metric-to-metric transition
    short_description: Pick a second metric on any well-covered metric page and
      watch every district keep its identity while the ranking re-sorts - a
      Gapminder-style re-rank needing zero time points. Reduced motion gets the
      static two-axis scatter instead.
    type: ui
    status: done
    priority: P2
    size: M
    test_status: partial
    notes: "Roadmap #547 phase C, per research/2026-08-20-455-animation-recheck.md
      (R1). Built in Ottomate iteration 42 (items 977-982). Stack decision at
      the gate: no new runtime dependency - CSS-staged SVG, adr-032 intact.
      Floors: >=690/735 districts, >=30/36 states; the MGNREGA family (678-683)
      sits under the district floor by design - lowering it is a deliberate
      future decision. URL state ?vs= makes comparisons shareable. The standing
      R1 rule holds by construction: nothing animates a fill across TIME."
    acceptance_criteria:
      - content: A metric page whose metric meets its level's coverage floor offers a
          picker of eligible partners derived from the store (never a
          hand-written list); a metric under the floor gets no section at all.
        test_status: not-tested
        linked_test: null
      - content: Picking a partner draws exactly one dot per region in the two metrics'
          SHARED set - never the base metric's whole set - and the comparison is
          shareable via ?vs= in the URL, restored on load.
        test_status: not-tested
        linked_test: null
      - content: "Re-sorting preserves each region's identity (stable keys, stable
          value-then-code tie-break) and stages the change: ~1s on position,
          colour following after the move settles."
        test_status: not-tested
        linked_test: null
      - content: Dot colours class the sorting metric through lib/breaks' own selector,
          edges and palettes (adr-033) - one definition per visual fact, never a
          second scheme.
        test_status: not-tested
        linked_test: null
      - content: Under prefers-reduced-motion the animation is replaced by the static
          two-axis scatter (both metrics at once, no motion controls); re-sorts
          announce via a scoped aria-live region and the picker is
          keyboard-operable.
        test_status: not-tested
        linked_test: null
    dependencies: []
