  - id: feat-choropleth-map
    title: Interactive choropleth with India to state to district drill
    short_description: "The core experience: a colour-graded map of India you can
      drill from country to state to district, in colour-blind-safe palettes."
    type: ui
    status: done
    priority: P0
    size: L
    test_status: partial
    acceptance_criteria:
      - content: "User views a metric as a district-level choropleth and clicks a state
          to drill into its districts. The districts must actually RENDER, for
          every state code including 01-09: a drill is verified by counting
          polygons on the map, never by the rail or the region count, because
          those read correctly over a blank plate and that is what hid this for
          a release (adr-041)."
        test_status: not-tested
        linked_test: null
      - content: The colour scale can be reversed from the legend itself in value mode,
          without opening the scale popover; the choice persists to the URL as
          rev=1 and is the same setting the popover DIRECTION row drives, not a
          second one
        test_status: passing
        linked_test: tests/iter35-controls.spec.ts
      - content: In value mode, where the metric warrants it, district fill opacity is
          weighted by population on a logarithmic scale between the p5 and p95
          bounds, so a large sparsely-populated district cannot dominate the
          reading by area alone.
        test_status: not-tested
        linked_test: null
      - content: Choropleth colouring uses a continuous scale with a min/max legend
        test_status: not-tested
        linked_test: null
      - content: A colour-blind-safe palette (Viridis) is the default; a diverging
          palette (RdBu) is used for vs-average mode
        test_status: not-tested
        linked_test: null
