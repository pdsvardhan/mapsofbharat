          shareable via ?vs= in the URL, restored on load.
        test_status: not-tested
        linked_test: null
      - content: "Re-sorting preserves each region's identity (stable keys, stable
          value-then-code tie-break) and stages the change: ~1s on position,
          colour following after the move settles."
        test_status: not-tested
        linked_test: null
      - content: Dot colours class the sorting metric through lib/breaks' own selector,
          edges and palettes (adr-033) - one definition per visual fact, never a
          second scheme.
        test_status: not-tested
        linked_test: null
      - content: Under prefers-reduced-motion the animation is replaced by the static
          two-axis scatter (both metrics at once, no motion controls); re-sorts
          announce via a scoped aria-live region and the picker is
          keyboard-operable.
        test_status: not-tested
        linked_test: null
    dependencies: []
  - id: feat-value-by-alpha
    parent_id: feat-choropleth-map
    title: Value-by-alpha population weighting
    short_description: Fill opacity weighted by population alongside fill colour by
      value, so the map stops weighting India by acreage. Carries its own legend
      key, and forces no-data to a hatch so absence can never be mistaken for
      faintness.
    type: ui
    status: done
    priority: P2
    size: M
    test_status: partial
    notes: Built iter-46 item 1077. Child of feat-choropleth-map, mirroring
      feat-social-export under feat-export-share. Split out because the parent
      had reached the 5-AC cap and this behaviour needs more than one criterion
      to state honestly.
    acceptance_criteria:
      - content: The legend carries a colour-by-alpha key, its rows labelled with real
          population figures, so a faded fill can be read off the key rather
          than guessed at.
        test_status: not-tested
        linked_test: null
      - content: Regions with no data are drawn as a hatch rather than a tone, in every
          mode and on both vintages, so absence of data is never mistaken for
          faintness. Measured worst fill-versus-hatch contrast 3.47:1, above the
          3:1 floor; tone alone measures as little as 1.01:1 and cannot carry
          the distinction.
        test_status: not-tested
        linked_test: null
      - content: The fade applies only where it is warranted, measured as a class-share
          total variation distance at or above 0.15, and the disclosure names
          the measured share.
        test_status: not-tested
        linked_test: null
      - content: A warrant that cannot be computed refuses and says so. A non-finite
          population or area can never fall through to a warranted verdict, and
