services:
  app:
    build:
      context: .
      args:
        # to-do 344: stamp the running commit into the image. Both default to the
        # literal "unknown" if the deploy is run without them, which is a visible
        # signal rather than a silent gap. Deploy with:
        #   GIT_SHA=$(git rev-parse --short HEAD) \
        #   GIT_DIRTY=$(git diff --quiet && echo clean || echo dirty) \
        #   docker compose up -d --build
        GIT_SHA: ${GIT_SHA:-unknown}
        GIT_DIRTY: ${GIT_DIRTY:-unknown}
    container_name: mapsofbharat
    restart: unless-stopped
    # Hard isolation on the shared 47-container box (todo 269, iter-102):
    # generous for a read-only SQLite app, but a runaway process can no longer
    # starve the media stack — nor be starved by a transcode.
    cpus: 4
    mem_limit: 2g
    ports:
      - "127.0.0.1:8610:3000"
    volumes:
      - ./data:/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - projects-net

networks:
  projects-net:
    external: true
